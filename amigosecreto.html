<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Amigo Secreto</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 20px;
}
h1 {
    text-align: center;
}
input, button {
    padding: 8px;
    margin: 4px 0;
    width: 100%;
}
button {
    cursor: pointer;
    background: #2ecc71;
    border: none;
    color: white;
    font-weight: bold;
}
.participante {
    background: white;
    padding: 8px;
    margin-bottom: 5px;
}
.link {
    background: #eef;
    padding: 10px;
    margin-top: 8px;
    word-break: break-all;
}
.hidden {
    display: none;
}
</style>
</head>

<body>

<h1>🎁 Amigo Secreto</h1>

<div id="cadastro">
    <input id="nomeInput" placeholder="Nome">
    <input id="foneInput" placeholder="Telefone (ex: 5511999999999)">
    <button onclick="adicionar()">Adicionar participante</button>
</div>

<h3>👥 Participantes</h3>
<div id="lista"></div>

<button onclick="sortear()">🎄 Sortear</button>

<div id="links" class="hidden"></div>
<div id="resultado" class="hidden"></div>

<script>
let participantes = [];
let sorteio = {};

// 🔹 Cadastro
function adicionar() {
    const nome = nomeInput.value.trim();
    const fone = foneInput.value.trim();

    if (!nome || !fone) {
        alert("Preencha nome e telefone");
        return;
    }

    participantes.push({ nome, fone });
    renderLista();

    nomeInput.value = "";
    foneInput.value = "";
}

function renderLista() {
    lista.innerHTML = "";
    participantes.forEach(p => {
        lista.innerHTML += `<div class="participante">${p.nome}</div>`;
    });
}

// 🔹 Sorteio com token
function sortear() {
    if (participantes.length < 2) {
        alert("Mínimo de 2 participantes");
        return;
    }

    let sorteados;
    do {
        sorteados = [...participantes].sort(() => Math.random() - 0.5);
    } while (participantes.some((p, i) => p.nome === sorteados[i].nome));

    sorteio = {};
    links.innerHTML = "<h3>📩 Envie UM link para cada pessoa</h3>";

    participantes.forEach((p, i) => {
        const token = Math.random().toString(36).substring(2, 10);
        sorteio[token] = {
            quem: p.nome,
            tirou: sorteados[i].nome
        };

        const linkSeguro = `${location.pathname}?token=${token}`;

        const msg = encodeURIComponent(
            `🎄 Amigo Secreto 🎄\n\nClique no link para ver quem você tirou:\n${location.origin}${linkSeguro}`
        );

        const wa = `https://wa.me/${p.fone}?text=${msg}`;

        links.innerHTML += `
            <div class="link">
                <strong>${p.nome}</strong><br>
                <a href="${wa}" target="_blank">Enviar link no WhatsApp</a>
            </div>
        `;
    });

    links.classList.remove("hidden");
}

// 🔹 Página de visualização (quem recebe)
function verificarToken() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token || !sorteio[token]) return;

    document.body.innerHTML = `
        <h1>🎁 Amigo Secreto</h1>
        <p><strong>${sorteio[token].quem}</strong>, você tirou:</p>
        <h2>🤫 ${sorteio[token].tirou}</h2>
        <p>Guarde segredo!</p>
    `;
}

verificarToken();
</script>

</body>
</html>
