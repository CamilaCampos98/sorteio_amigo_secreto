<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Amigo Secreto</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 20px;
}

h1 { 
    text-align: center; 
}

input, button {
    padding: 8px;
    margin: 4px 0;
    width: 100%;
}

button {
    background: #2ecc71;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.participante, .link {
    background: white;
    padding: 10px;
    margin-bottom: 6px;
}

/* ===== TELA DO RESULTADO ===== */

.resultado-container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #e8f5e9, #ffffff);
    padding: 20px;
}

.resultado-card {
    background: #ffffff;
    max-width: 360px;
    width: 100%;
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.resultado-card h1 {
    font-size: 26px;
    margin-bottom: 10px;
}

.resultado-card p {
    font-size: 16px;
    margin: 10px 0;
}

.resultado-nome {
    font-size: 30px;
    font-weight: bold;
    color: #2ecc71;
    margin: 18px 0;
}

.resultado-aviso {
    font-size: 14px;
    color: #666;
}
</style>
</head>

<body>

<h1>🎁 Amigo Secreto</h1>

<div>
    <input id="nomeInput" placeholder="Nome">
    <input id="foneInput" placeholder="Telefone (ex: 5511999999999)">
    <button onclick="adicionar()">Adicionar participante</button>
</div>

<h3>👥 Participantes</h3>
<div id="lista"></div>

<button onclick="sortear()">🎄 Sortear</button>

<div id="links"></div>

<script>
let participantes = [];

function adicionar() {
    const nome = nomeInput.value.trim();
    const fone = foneInput.value.trim();
    if (!nome || !fone) return alert("Preencha tudo");
    participantes.push({ nome, fone });
    lista.innerHTML += `<div class="participante">${nome}</div>`;
    nomeInput.value = foneInput.value = "";
}

function sortear() {
    if (participantes.length < 2)
        return alert("Mínimo 2 participantes");

    let sorteados;
    do {
        sorteados = [...participantes].sort(() => Math.random() - 0.5);
    } while (participantes.some((p, i) => p.nome === sorteados[i].nome));

    links.innerHTML = "<h3>📩 Envie os links</h3>";

    participantes.forEach((p, i) => {
        const amigo = btoa(unescape(encodeURIComponent(sorteados[i].nome)));
        const link = `${location.origin}${location.pathname}?t=${amigo}`;

        const msg = encodeURIComponent(
`🎄 Amigo Secreto 🎄

Clique no link para ver quem você tirou:
${link}`
        );

        const wa = `https://wa.me/${p.fone}?text=${msg}`;

        links.innerHTML += `
            <div class="link">
                <strong>${p.nome}</strong><br>
                <a href="${wa}" target="_blank">Enviar no WhatsApp</a>
            </div>
        `;
    });
}

// 🔓 Quem recebe o link
const params = new URLSearchParams(location.search);
if (params.has("t")) {
    const nome = decodeURIComponent(escape(atob(params.get("t"))));
    document.body.innerHTML = `
<div class="resultado-container">
  <div class="resultado-card">
    <h1>🎁 Amigo Secreto</h1>

    <p>Você tirou:</p>

    <div class="resultado-nome">
      😲 <span id="amigoSorteado"></span>
    </div>

    <p class="resultado-aviso">
      Guarde segredo 🤫 <br>
      Feliz Natal! 🎄
    </p>
  </div>
</div>
`;
}
</script>

</body>
</html>
