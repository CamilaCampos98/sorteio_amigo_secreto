<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Amigo Secreto</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 20px;
}
h1 { text-align: center; }
input, button {
    padding: 8px;
    margin: 4px 0;
    width: 100%;
}
button {
    background: #2ecc71;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
}
.participante, .link {
    background: white;
    padding: 10px;
    margin-bottom: 6px;
}
</style>
</head>

<body>

<h1>🎁 Amigo Secreto</h1>

<div>
    <input id="nomeInput" placeholder="Nome">
    <input id="foneInput" placeholder="Telefone (ex: 5511999999999)">
    <button onclick="adicionar()">Adicionar participante</button>
</div>

<h3>👥 Participantes</h3>
<div id="lista"></div>

<button onclick="sortear()">🎄 Sortear</button>

<div id="links"></div>

<script>
let participantes = [];

function adicionar() {
    const nome = nomeInput.value.trim();
    const fone = foneInput.value.trim();
    if (!nome || !fone) return alert("Preencha tudo");
    participantes.push({ nome, fone });
    lista.innerHTML += `<div class="participante">${nome}</div>`;
    nomeInput.value = foneInput.value = "";
}

function sortear() {
    if (participantes.length < 2)
        return alert("Mínimo 2 participantes");

    let sorteados;
    do {
        sorteados = [...participantes].sort(() => Math.random() - 0.5);
    } while (participantes.some((p, i) => p.nome === sorteados[i].nome));

    links.innerHTML = "<h3>📩 Envie os links</h3>";

    participantes.forEach((p, i) => {
        const amigo = btoa(unescape(encodeURIComponent(sorteados[i].nome)));
        const link = `${location.origin}${location.pathname}?t=${amigo}`;

        const msg = encodeURIComponent(
`🎄 Amigo Secreto 🎄

Clique no link para ver quem você tirou:
${link}`
        );

        const wa = `https://wa.me/${p.fone}?text=${msg}`;

        links.innerHTML += `
            <div class="link">
                <strong>${p.nome}</strong><br>
                <a href="${wa}" target="_blank">Enviar no WhatsApp</a>
            </div>
        `;
    });
}

// 🔓 Quem recebe o link
const params = new URLSearchParams(location.search);
if (params.has("t")) {
    const nome = decodeURIComponent(escape(atob(params.get("t"))));
    document.body.innerHTML = `
        <h1>🎁 Amigo Secreto</h1>
        <p>Você tirou:</p>
        <h2>🤫 ${nome}</h2>
        <p>Guarde segredo!</p>
    `;
}
</script>

</body>
</html>
