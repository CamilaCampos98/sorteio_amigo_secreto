<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Amigo Secreto</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 20px;
}

h1 { 
    text-align: center; 
}

input, select, button {
    padding: 8px;
    margin: 4px 0;
    width: 100%;
}

button {
    background: #2ecc71;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.participante, .link {
    background: white;
    padding: 10px;
    margin-bottom: 6px;
    border-radius: 6px;
}

/* ===== RESULTADO ===== */

.resultado-container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #e8f5e9, #ffffff);
    padding: 20px;
}

.resultado-card {
    background: #ffffff;
    max-width: 360px;
    width: 100%;
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.resultado-nome {
    font-size: 30px;
    font-weight: bold;
    color: #2ecc71;
    margin: 18px 0;
}

.resultado-aviso {
    font-size: 14px;
    color: #666;
}
</style>
</head>

<body>

<h1>🎁 Amigo Secreto</h1>

<div>
    <input id="nomeInput" placeholder="Nome">
    <input id="foneInput" placeholder="Telefone (ex: 5511999999999)">
    <button onclick="adicionar()">Adicionar participante</button>
</div>

<h3>👥 Participantes</h3>
<div id="lista"></div>

<h3>🚫 Regra de exclusão (opcional)</h3>
<select id="excluidor"></select>
<select id="excluido"></select>
<button onclick="addExclusao()">Adicionar exclusão</button>

<div id="listaExclusoes"></div>

<button onclick="sortear()">🎄 Sortear</button>

<div id="links"></div>

<script>
let participantes = [];
let exclusoes = {};

function adicionar() {
    const nome = nomeInput.value.trim();
    const fone = foneInput.value.trim();
    if (!nome || !fone) return alert("Preencha tudo");

    participantes.push({ nome, fone });
    lista.innerHTML += `<div class="participante">${nome}</div>`;

    excluidor.innerHTML += `<option value="${nome}">${nome}</option>`;
    excluido.innerHTML += `<option value="${nome}">${nome}</option>`;

    nomeInput.value = foneInput.value = "";
}

function addExclusao() {
    const de = excluidor.value;
    const naoPode = excluido.value;

    if (de === naoPode)
        return alert("A pessoa não pode excluir ela mesma");

    if (!exclusoes[de]) exclusoes[de] = [];
    if (!exclusoes[de].includes(naoPode)) {
        exclusoes[de].push(naoPode);

        listaExclusoes.innerHTML += `
            <div class="participante">
                🚫 <strong>${de}</strong> não pode tirar <strong>${naoPode}</strong>
            </div>
        `;
    }
}

function sortear() {
    if (participantes.length < 2)
        return alert("Mínimo 2 participantes");

    let sorteados;
    let tentativas = 0;

    do {
        tentativas++;
        sorteados = [...participantes].sort(() => Math.random() - 0.5);

        if (tentativas > 500) {
            alert("Não foi possível sortear com essas regras 😢");
            return;
        }

    } while (
        participantes.some((p, i) =>
            p.nome === sorteados[i].nome ||
            exclusoes[p.nome]?.includes(sorteados[i].nome)
        )
    );

    links.innerHTML = "<h3>📩 Envie os links</h3>";

    participantes.forEach((p, i) => {
        const amigo = btoa(unescape(encodeURIComponent(sorteados[i].nome)));
        const link = `${location.origin}${location.pathname}?t=${amigo}`;

        const msg = encodeURIComponent(
`🎄 Amigo Secreto 🎄

Clique no link para ver quem você tirou:
${link}`
        );

        const wa = `https://wa.me/${p.fone}?text=${msg}`;

        links.innerHTML += `
            <div class="link">
                <strong>${p.nome}</strong><br>
                <a href="${wa}" target="_blank">Enviar no WhatsApp</a>
            </div>
        `;
    });
}

// 🔓 Quem recebe o link
const params = new URLSearchParams(location.search);
if (params.has("t")) {
    const nome = decodeURIComponent(escape(atob(params.get("t"))));
    document.body.innerHTML = `
<div class="resultado-container">
  <div class="resultado-card">
    <h1>🎁 Amigo Secreto</h1>
    <p>Você tirou:</p>
    <div class="resultado-nome">🤫 ${nome}</div>
    <p class="resultado-aviso">
      Guarde segredo <br>
      Feliz Natal! 🎄
    </p>
  </div>
</div>
`;
}
</script>

</body>
</html>
