<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Amigo Secreto</title>

<style>
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f9b4f, #2ecc71);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
}

/* ===== CARD PRINCIPAL ===== */

.app-container {
    background: #ffffff;
    width: 100%;
    max-width: 460px;
    border-radius: 24px;
    padding: 30px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    position: relative;
    animation: fadeIn 1s ease-out;
}

/* ===== ANIMAÇÃO NEVE (fundo) ===== */
.snowflake {
    position: fixed;
    top: -20px;
    color: white;
    font-size: 16px;
    pointer-events: none;
    z-index: 9999;
    user-select: none;
    animation-name: cair;
    animation-timing-function: linear;
}

@keyframes cair {
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}

/* ===== TÍTULOS ===== */

h1 {
    text-align: center;
    color: #b02a2a;
    font-size: 32px;
    margin-bottom: 12px;
    text-transform: uppercase;
}

.subtitulo {
    text-align: center;
    font-size: 14px;
    color: #555;
    margin-bottom: 22px;
}

/* ===== FORM ===== */

input, select {
    width: 100%;
    padding: 12px 14px;
    margin-top: 6px;
    margin-bottom: 16px;
    border-radius: 12px;
    border: 1px solid #ddd;
    font-size: 14px;
    transition: border 0.3s, box-shadow 0.3s;
}

input:focus, select:focus {
    border-color: #1e8f5a;
    box-shadow: 0 0 0 3px rgba(30,143,90,0.15);
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #b02a2a, #e74c3c);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(231,76,60,0.4);
}

/* ===== SEÇÕES ===== */

h3 {
    margin-top: 26px;
    margin-bottom: 10px;
    color: #0b6b3a;
    font-size: 16px;
}

.info {
    font-size: 14px;
    color: #555;
    margin-bottom: 12px;
}

/* ===== LISTAS ===== */

.participante, .link {
    background: #f7f7f7;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-radius: 12px;
    position: relative;
    font-size: 14px;
    border-left: 4px solid #1e8f5a;
}

.link a {
    display: inline-block;
    margin-top: 8px;
    text-decoration: none;
    color: #1e8f5a;
    font-weight: 600;
}

.link a:hover {
    text-decoration: underline;
}

.excluir-btn {
    position: absolute;
    right: 12px;
    top: 10px;
    cursor: pointer;
    font-size: 18px;
    color: #b02a2a;
}

/* ===== RESULTADO ===== */

.resultado-container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f9b4f, #2ecc71);
    padding: 20px;
}

.resultado-card {
    background: #ffffff;
    max-width: 380px;
    width: 100%;
    border-radius: 24px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

.resultado-nome {
    font-size: 32px;
    font-weight: bold;
    color: #b02a2a;
    margin: 20px 0;
}

.resultado-aviso {
    font-size: 14px;
    color: #555;
    line-height: 1.5;
}

/* ===== TÉCNICO ===== */
@media (max-width: 768px) {
    .app-container {
        padding: 20px 18px;
    }
    h1 {
        font-size: 28px;
    }
    .subtitulo {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- Neve caindo -->
<div class="snowflake" style="left: 10%; animation-delay: 0s;">❄</div>
<div class="snowflake" style="left: 30%; animation-delay: 2s;">❄</div>
<div class="snowflake" style="left: 50%; animation-delay: 4s;">❄</div>
<div class="snowflake" style="left: 70%; animation-delay: 3s;">❄</div>
<div class="snowflake" style="left: 90%; animation-delay: 5s;">❄</div>

<!-- App Container -->
<div class="app-container">
    <h1>🎁 Amigo Secreto</h1>
    <div class="subtitulo">Sorteio simples e secreto para a família 🎄</div>

    <input id="nomeInput" placeholder="Nome do participante">
    <input id="foneInput" placeholder="WhatsApp (ex: 5511999999999)">
    <button onclick="adicionar()">Adicionar participante</button>

    <h3>👥 Participantes</h3>
    <div id="lista"></div>

    <h3>🚫 Regra de exclusão (opcional)</h3>
    <div class="info">
        Escolha quem <strong>não pode tirar</strong> outra pessoa no sorteio.
    </div>

    <label>Quem NÃO pode tirar</label>
    <select id="excluidor"></select>

    <label>Pessoa que NÃO pode ser tirada</label>
    <select id="excluido"></select>

    <button onclick="addExclusao()">Adicionar exclusão</button>

    <div id="listaExclusoes"></div>

    <button onclick="sortear()">🎄 Fazer sorteio</button>

    <div id="links"></div>
</div>

<script>
let participantes = [];
let exclusoes = {};

function adicionar() {
    const nome = nomeInput.value.trim();
    const fone = foneInput.value.trim();
    if (!nome || !fone) return alert("Preencha tudo");

    participantes.push({ nome, fone });
    lista.innerHTML += `<div class="participante">${nome}</div>`;

    excluidor.innerHTML += `<option value="${nome}">${nome}</option>`;
    excluido.innerHTML += `<option value="${nome}">${nome}</option>`;

    nomeInput.value = foneInput.value = "";
}

function addExclusao() {
    const de = excluidor.value;
    const naoPode = excluido.value;

    if (de === naoPode) return alert("A pessoa não pode excluir ela mesma");

    if (!exclusoes[de]) exclusoes[de] = [];
    if (exclusoes[de].includes(naoPode)) return;

    exclusoes[de].push(naoPode);

    const id = `${de}-${naoPode}`.replace(/\s/g, '');

    listaExclusoes.innerHTML += `
        <div class="participante" id="${id}">
            🚫 <strong>${de}</strong> não pode tirar <strong>${naoPode}</strong>
            <span class="excluir-btn" onclick="removerExclusao('${de}','${naoPode}','${id}')">❌</span>
        </div>
    `;
}

function removerExclusao(de, naoPode, id) {
    exclusoes[de] = exclusoes[de].filter(n => n !== naoPode);
    document.getElementById(id).remove();
}

function sortear() {
    if (participantes.length < 2)
        return alert("Mínimo 2 participantes");

    let sorteados;
    let tentativas = 0;

    do {
        tentativas++;
        sorteados = [...participantes].sort(() => Math.random() - 0.5);
        if (tentativas > 500)
            return alert("Não foi possível sortear com essas regras 😢");
    } while (
        participantes.some((p, i) =>
            p.nome === sorteados[i].nome ||
            exclusoes[p.nome]?.includes(sorteados[i].nome)
        )
    );

    links.innerHTML = "<h3>📩 Envie os links</h3>";

    participantes.forEach((p, i) => {
        const amigo = btoa(unescape(encodeURIComponent(sorteados[i].nome)));
        const link = `${location.origin}${location.pathname}?t=${amigo}`;
        const msg = encodeURIComponent(
`🎄 Amigo Secreto 🎄

Clique no link para ver quem você tirou:
${link}` 
        );
        links.innerHTML += `
            <div class="link">
                <strong>${p.nome}</strong><br>
                <a href="https://wa.me/${p.fone}?text=${msg}" target="_blank">
                    Enviar no WhatsApp
                </a>
            </div>
        `;
    });
}

// Tela do resultado
const params = new URLSearchParams(location.search);
if (params.has("t")) {
    const nome = decodeURIComponent(escape(atob(params.get("t"))));
    document.body.innerHTML = `
<div class="resultado-container">
  <div class="resultado-card">
    <h1>🎁 Amigo Secreto</h1>
    <p>Você tirou:</p>
    <div class="resultado-nome">🤫 ${nome}</div>
    <p class="resultado-aviso">
      Guarde segredo <br>
      Feliz Natal! 🎄
    </p>
  </div>
</div>`;
}
</script>

</body>
</html>
