<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigo Secreto</title>

<style>
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    margin: 0;
    background: linear-gradient(135deg, #0f9b4f, #2ecc71);
    padding: 16px;
}

/* ===== NEVE ===== */
#snow-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.snowflake {
    position: absolute;
    top: -20px;
    color: white;
    animation-name: fall;
    animation-timing-function: linear;
}

@keyframes fall {
    to {
        transform: translateY(110vh);
    }
}

/* ===== APP ===== */
.page {
    display: flex;
    justify-content: center;
    width: 100%;
    position: relative;
    z-index: 2;
}

.app-container {
    background: #ffffff;
    width: 100%;
    max-width: 480px;
    border-radius: 24px;
    padding: 26px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

/* ===== TEXTOS ===== */
h1 {
    text-align: center;
    color: #b02a2a;
    font-size: 30px;
    margin-bottom: 10px;
}

.subtitulo {
    text-align: center;
    font-size: 14px;
    color: #555;
    margin-bottom: 22px;
}

/* ===== FORM ===== */
input, select {
    width: 100%;
    padding: 14px;
    margin-bottom: 14px;
    border-radius: 12px;
    border: 1px solid #ddd;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #b02a2a, #e74c3c);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 14px;
}

/* ===== LISTAS ===== */
.participante, .link {
    background: #f7f7f7;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 12px;
    font-size: 14px;
    border-left: 4px solid #1e8f5a;
}

.link a {
    color: #1e8f5a;
    font-weight: bold;
    text-decoration: none;
}

/* ===== RESULTADO ===== */
.resultado-container {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
    z-index: 2;
}

.resultado-card {
    background: white;
    padding: 30px;
    border-radius: 24px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

.resultado-nome {
    font-size: 32px;
    color: #b02a2a;
    margin: 20px 0;
}

/* ===== MOBILE ===== */
@media (max-width: 480px) {
    h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div id="snow-container"></div>

<div class="page">
<div class="app-container">

<h1>🎁 Amigo Secreto</h1>
<div class="subtitulo">Sorteio simples e secreto 🎄</div>

<input id="nomeInput" placeholder="Nome do participante">
<input id="foneInput" placeholder="WhatsApp (5511999999999)">
<button onclick="adicionar()">Adicionar participante</button>

<h3>👥 Participantes</h3>
<div id="lista"></div>

<h3>🚫 Regra de exclusão</h3>
<select id="excluidor"></select>
<select id="excluido"></select>
<button onclick="addExclusao()">Adicionar exclusão</button>

<div id="listaExclusoes"></div>

<button onclick="sortear()">🎄 Fazer sorteio</button>

<div id="links"></div>

</div>
</div>

<script>
let participantes = [];
let exclusoes = {};

/* ===== NEVE ===== */
function iniciarNeve() {
    const container = document.getElementById("snow-container");

    setInterval(() => {
        const floco = document.createElement("div");
        floco.className = "snowflake";
        floco.innerText = "❄";

        floco.style.left = Math.random() * window.innerWidth + "px";
        floco.style.fontSize = Math.random() * 12 + 10 + "px";
        floco.style.opacity = Math.random();
        floco.style.animationDuration = Math.random() * 6 + 6 + "s";

        container.appendChild(floco);
        setTimeout(() => floco.remove(), 12000);
    }, 250);
}

iniciarNeve();

/* ===== APP ===== */
function adicionar() {
    const nome = nomeInput.value.trim();
    const fone = foneInput.value.trim();
    if (!nome || !fone) return alert("Preencha tudo");

    participantes.push({ nome, fone });
    lista.innerHTML += `<div class="participante">${nome}</div>`;
    excluidor.innerHTML += `<option>${nome}</option>`;
    excluido.innerHTML += `<option>${nome}</option>`;

    nomeInput.value = foneInput.value = "";
}

function addExclusao() {
    const de = excluidor.value;
    const nao = excluido.value;
    if (de === nao) return alert("Não pode excluir a si mesmo");

    exclusoes[de] = exclusoes[de] || [];
    if (!exclusoes[de].includes(nao)) {
        exclusoes[de].push(nao);
        listaExclusoes.innerHTML += `
            <div class="participante">🚫 ${de} não pode tirar ${nao}</div>`;
    }
}

function sortear() {
    let sorteados, tentativas = 0;

    do {
        sorteados = [...participantes].sort(() => Math.random() - 0.5);
        tentativas++;
        if (tentativas > 500) return alert("Não foi possível sortear");
    } while (participantes.some((p, i) =>
        p.nome === sorteados[i].nome ||
        exclusoes[p.nome]?.includes(sorteados[i].nome)
    ));

    links.innerHTML = "<h3>📩 Enviar links</h3>";

    participantes.forEach((p, i) => {
        const nome = btoa(unescape(encodeURIComponent(sorteados[i].nome)));
        const link = `${location.origin}${location.pathname}?t=${nome}`;
        links.innerHTML += `
            <div class="link">
                ${p.nome}<br>
                <a href="https://wa.me/${p.fone}?text=${encodeURIComponent(link)}" target="_blank">
                    Enviar WhatsApp
                </a>
            </div>`;
    });
}

/* ===== RESULTADO ===== */
const params = new URLSearchParams(location.search);
if (params.has("t")) {
    const nome = decodeURIComponent(escape(atob(params.get("t"))));

    document.body.innerHTML = `
    <div id="snow-container"></div>
    <div class="resultado-container">
        <div class="resultado-card">
            <h1>🎁 Amigo Secreto</h1>

            <p>Você tirou:</p>
            <div class="resultado-nome">🤫 ${nome}</div>

            <p style="margin-top: 20px; font-size: 15px; color: #555; line-height: 1.5;">
                💰 <strong>Valor sugerido:</strong> entre <strong>R$ 30 e R$ 50</strong><br>
                🍫 Pode ser <strong>chocolate</strong> ou uma <strong>lembrancinha</strong> 🎁
            </p>

            <p style="margin-top: 16px;">Guarde segredo 🎄❄️</p>
        </div>
    </div>
`;

    iniciarNeve(); // 👈 NEVE NO RESULTADO
}
</script>

</body>
</html>
